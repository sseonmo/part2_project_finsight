<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="finsight">
  <style>
    .plate { fill: #0B0B12 }
    .glyph { fill: #FFFFFF }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #F1F1F5 }
      .glyph { fill: #0B0B12 }
    }
  </style>
  <rect class="plate" width="32" height="32" rx="8" />
  <text
    class="glyph"
    x="16"
    y="16"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="21"
    font-weight="500"
    letter-spacing="-0.4"
  >f</text>
</svg>
